<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hl-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hl-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagonal Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           stroke="url(#hl-grad-1)" 
           stroke-width="3.5" 
           fill="#0B0F1F" 
           fill-opacity="0.9" />

  <!-- Inner Neural Network Nodes & Links -->
  <path d="M50 20 L28 45 L50 70 L72 45 Z" stroke="url(#hl-grad-2)" stroke-width="2" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Stylized 'H' and 'L' AI Geometry -->
  <path d="M35 32 L35 68 M35 50 L65 50 M65 32 L65 68 M65 68 L76 68" 
        stroke="url(#hl-grad-1)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Glowing Nexus Node in Center -->
  <circle cx="50" cy="50" r="4.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="50" cy="20" r="3" fill="#A855F7"/>
  <circle cx="28" cy="45" r="3" fill="#06B6D4"/>
  <circle cx="72" cy="45" r="3" fill="#8B5CF6"/>
  <circle cx="50" cy="70" r="3" fill="#38BDF8"/>
</svg>
